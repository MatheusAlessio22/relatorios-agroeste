<meta charset="utf-8">

<title>Vendas Milho · Agroeste</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{color-scheme:light only;--bg:#f4f4f0;--ink:#141414;--ink2:#45453f;--mute:#75756d;--line:#141414;--acc:#005c9e;--err:#b3261e}
*{box-sizing:border-box;border-radius:0}
html,body{margin:0}
body{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:space-between;background:var(--bg);color:var(--ink);font-family:"IBM Plex Mono",ui-monospace,monospace;padding:calc(14px + env(safe-area-inset-top)) 0 env(safe-area-inset-bottom)}
.tp{display:flex;justify-content:space-between;gap:12px;font-size:11px;text-transform:uppercase;padding:0 16px 10px;border-bottom:1px solid var(--line)}
.lg{display:block;width:min(260px,62vw);height:auto;margin:24px 16px 0}
h1{font-family:"Archivo","Arial Narrow",sans-serif;font-stretch:125%;font-weight:900;font-size:clamp(38px,12.4vw,96px);line-height:.84;letter-spacing:-.035em;text-transform:uppercase;margin:32px 16px 0}
form{border-top:1px solid var(--line)}
.lb{font-size:11px;font-weight:600;text-transform:uppercase;padding:12px 16px 8px}
.row{display:flex;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
input{flex:1;min-width:0;height:56px;border:0;outline:0;background:transparent;color:var(--ink);font:600 18px "IBM Plex Mono",monospace;letter-spacing:.04em;padding:0 16px}
input::placeholder{color:var(--mute)}
button{flex:none;min-width:96px;height:56px;border:0;border-left:1px solid var(--line);background:var(--ink);color:var(--bg);font:600 13px "IBM Plex Mono",monospace;text-transform:uppercase;cursor:pointer}
button:active{background:var(--acc);color:#fff}
button:disabled{opacity:.5;cursor:wait}
.msg{min-height:44px;padding:10px 16px;font-size:12px;text-transform:uppercase;color:var(--err);font-weight:600}
</style>
</head>
