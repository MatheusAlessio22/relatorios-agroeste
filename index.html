<title>Vendas Milho Agroeste</title>
<style>
:root{color-scheme:light;--page:#f9f9f7;--card:#fff;--ink:#0b0b0b;--ink-2:#52514e;--axis:#c3c2b7;--border:rgba(11,11,11,.10);--accent:#2a78d6;--err:#d03b3b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--page:#0d0d0d;--card:#1a1a19;--ink:#fff;--ink-2:#c3c2b7;--axis:#383835;--border:rgba(255,255,255,.10);--accent:#3987e5;--err:#e66767}}
:root[data-theme="dark"]{color-scheme:dark;--page:#0d0d0d;--card:#1a1a19;--ink:#fff;--ink-2:#c3c2b7;--axis:#383835;--border:rgba(255,255,255,.10);--accent:#3987e5;--err:#e66767}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--page);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px}
form{width:100%;max-width:380px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:28px}
.eb{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);font-weight:600}
h1{font-size:22px;margin:6px 0 4px}
p{margin:0 0 20px;color:var(--ink-2);font-size:14px}
input{width:100%;font:inherit;color:var(--ink);background:var(--page);border:1px solid var(--axis);border-radius:8px;padding:11px 12px}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
button{width:100%;margin-top:12px;font:inherit;font-weight:600;color:#fff;background:var(--accent);border:0;border-radius:8px;padding:11px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.msg{min-height:20px;margin-top:10px;font-size:13.5px;color:var(--err)}
</style>
</head>
