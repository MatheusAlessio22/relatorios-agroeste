<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Vendas Milho · Agroeste</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light only;--ink:#0f172a;--ink2:#334155;--mute:#64748b;--faint:#94a3b8;--border:#e2e8f0;--blue:#005c9e;--blue-h:#004b82;--blue-a:#003d6b;--green:#6cb33f;--cyan:#009cdb;--err:#b42318;--err-bg:#fef3f2}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;color:var(--ink);font-family:"Inter","Segoe UI",-apple-system,Roboto,sans-serif;-webkit-font-smoothing:antialiased;padding:24px 16px calc(24px + env(safe-area-inset-bottom));
  background:radial-gradient(1200px 600px at 10% -10%,rgba(0,156,219,.14),transparent 60%),radial-gradient(900px 500px at 110% 110%,rgba(108,179,63,.14),transparent 60%),linear-gradient(180deg,#f8fafc 0%,#eef5fb 100%)}
.card{width:100%;max-width:400px;background:#fff;border:1px solid var(--border);border-radius:16px;box-shadow:0 1px 3px rgba(0,0,0,.05),0 12px 32px -8px rgba(15,23,42,.12);overflow:hidden}
.card::before{content:"";display:block;height:4px;background:linear-gradient(90deg,var(--blue),var(--cyan) 60%,var(--green))}
.bd{padding:32px 24px 24px}
.lg{display:block;width:168px;height:auto;margin:0 auto 28px}
h1{font-size:20px;font-weight:700;letter-spacing:-.015em;text-align:center;margin:0}
.sub{margin:6px 0 24px;font-size:14px;color:var(--mute);text-align:center;line-height:1.5}
label{display:block;font-size:13.5px;font-weight:600;color:var(--ink2);margin-bottom:6px}
.fld{position:relative}
.fld svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--faint);pointer-events:none;transition:color .2s}
input{width:100%;height:48px;border:1px solid var(--border);border-radius:10px;background:#f8fafc;color:var(--ink);font:500 16px "Inter",sans-serif;padding:0 14px 0 42px;outline:0;transition:border-color .2s,box-shadow .2s,background .2s}
input:hover{border-color:#cbd5e1}
input:focus{border-color:var(--blue);background:#fff;box-shadow:0 0 0 4px rgba(0,92,158,.14)}
.fld:focus-within svg{color:var(--blue)}
input::placeholder{color:var(--faint);font-weight:400}
input[aria-invalid="true"]{border-color:var(--err);box-shadow:0 0 0 4px rgba(180,35,24,.10)}
button{position:relative;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:48px;margin-top:14px;border:0;border-radius:10px;background:var(--blue);color:#fff;font:600 15px "Inter",sans-serif;cursor:pointer;transition:background .2s,transform .1s,box-shadow .2s;box-shadow:0 1px 2px rgba(0,92,158,.25)}
button:hover{background:var(--blue-h);box-shadow:0 4px 12px -2px rgba(0,92,158,.35)}
button:active{background:var(--blue-a);transform:scale(.985)}
button:focus-visible{outline:none;box-shadow:0 0 0 4px rgba(0,156,219,.35)}
button:disabled{cursor:wait;background:var(--blue-h)}
.sp{display:none;width:18px;height:18px;border-radius:50%;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;animation:spin .7s linear infinite}
button.ld .sp{display:block}
@keyframes spin{to{transform:rotate(360deg)}}
.msg{display:none;margin-top:12px;padding:10px 12px;border-radius:8px;background:var(--err-bg);font-size:13.5px;font-weight:500;color:var(--err)}
.msg.on{display:block}
.ft{display:flex;align-items:center;justify-content:center;gap:6px;padding:14px 24px;border-top:1px solid var(--border);background:#f8fafc;font-size:12.5px;color:var(--mute)}
.ft svg{width:14px;height:14px;color:var(--green)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.sp{animation-duration:2s}}
</style>
</head>
