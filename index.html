<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="color-scheme" content="light only">
<title>Vendas Milho · Agroeste</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light only;--bg:#f3f4f6;--ink:#111827;--head:#4b5563;--mute:#6b7280;--faint:#9ca3af;--border:#d1d5db;--hair:#e5e7eb;--blue:#005c9e;--err:#b42318}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);font-family:"Inter","Segoe UI",-apple-system,Roboto,sans-serif;padding:24px 12px calc(24px + env(safe-area-inset-bottom))}
form{width:100%;max-width:380px;background:#fff;border:1px solid var(--border);border-radius:2px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border)}
.lg{display:block;width:108px;height:auto}
.hd span{font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--mute);text-align:right;line-height:1.5}
.bd{padding:16px}
h1{font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--head);margin:0 0 4px}
p{margin:0 0 16px;font-size:13px;color:var(--mute)}
label{display:block;font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--mute);margin-bottom:6px}
input{width:100%;height:44px;border:1px solid var(--border);border-radius:2px;background:#fff;color:var(--ink);font:400 16px "Inter",sans-serif;padding:0 12px;outline:0}
input:focus{border-color:var(--ink)}
input::placeholder{color:var(--faint)}
button{width:100%;height:44px;margin-top:10px;border:1px solid var(--ink);border-radius:2px;background:var(--ink);color:#fff;font:600 12px "Inter",sans-serif;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
button:active{background:#374151}
button:disabled{opacity:.6;cursor:wait}
.msg{min-height:20px;margin-top:10px;font-size:12.5px;font-weight:500;color:var(--err)}
.ft{border-top:1px solid var(--hair);padding:10px 16px;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);background:#f9fafb}
</style>
</head>
