<title>Vendas Milho · Agroeste</title>

<style>
:root{color-scheme:light only;--bg:#f4f5f7;--ink:#0f172a;--mute:#64748b;--faint:#94a3b8;--line:#e2e8f0;--blue:#005c9e;--blue-10:rgba(0,92,158,.10);--err:#b42318}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",ui-sans-serif,system-ui,sans-serif;padding:24px 16px calc(24px + env(safe-area-inset-bottom))}
form{width:100%;max-width:400px;background:#fff;border-radius:24px;box-shadow:0 4px 40px rgba(0,0,0,.04);padding:32px 24px 24px}
.lg{display:block;width:150px;height:auto;margin:0 0 28px}
h1{font-size:24px;font-weight:800;letter-spacing:-.02em;margin:0}
p{margin:6px 0 24px;font-size:14.5px;color:var(--mute);line-height:1.5}
label{display:block;font-size:13px;font-weight:600;margin-bottom:8px}
input{width:100%;height:52px;border:1px solid var(--line);border-radius:14px;background:#f8fafc;color:var(--ink);font:500 16px "Plus Jakarta Sans",sans-serif;padding:0 16px;outline:0;transition:border-color .2s,box-shadow .2s}
input:focus{border-color:var(--blue);box-shadow:0 0 0 4px var(--blue-10);background:#fff}
input::placeholder{color:var(--faint)}
button{width:100%;height:52px;margin-top:14px;border:0;border-radius:14px;background:var(--blue);color:#fff;font:700 15px "Plus Jakarta Sans",sans-serif;cursor:pointer;transition:opacity .2s}
button:active{opacity:.85}
button:disabled{opacity:.6;cursor:wait}
.msg{min-height:22px;margin-top:12px;font-size:13.5px;font-weight:500;color:var(--err);text-align:center}
.ft{margin-top:8px;font-size:12px;color:var(--faint);text-align:center}
</style>
</head>
