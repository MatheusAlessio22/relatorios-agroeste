<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light only">
<title>Vendas Milho · Agroeste</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light only;--bg:#f8fafc;--ink:#0f172a;--ink2:#334155;--mute:#64748b;--faint:#94a3b8;--border:#e2e8f0;--border2:#cbd5e1;--blue:#005c9e;--blue-h:#004b82;--blue-a:#003d6b;--blue-50:#eef5fb;--green:#6cb33f;--green-ink:#2f6e1b;--err:#b42318;--err-bg:#fef3f2}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);font-family:"Inter","Segoe UI",-apple-system,Roboto,sans-serif;-webkit-font-smoothing:antialiased;padding:24px 16px calc(24px + env(safe-area-inset-bottom))}
.card{width:100%;max-width:400px;background:#fff;border:1px solid var(--border2);border-top:3px solid var(--blue);border-radius:4px}
.bd{padding:28px 22px 22px}
.lg{display:block;width:156px;height:auto;margin:0 auto 24px}
h1{font-size:18px;font-weight:700;letter-spacing:-.01em;text-align:center;margin:0}
.sub{margin:6px 0 22px;font-size:13.5px;color:var(--mute);text-align:center;line-height:1.5}
.nw{white-space:nowrap}
label.l{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin-bottom:6px}
.fld{position:relative;display:flex;border:1px solid var(--border2);border-radius:4px;background:#fff;transition:border-color .15s}
.fld:focus-within{border-color:var(--blue);outline:1px solid var(--blue);outline-offset:-2px}
.fld[data-err="true"]{border-color:var(--err);outline:1px solid var(--err);outline-offset:-2px}
.fld .lk{flex:none;display:grid;place-items:center;width:40px;color:var(--faint);border-right:1px solid var(--border)}
.fld:focus-within .lk{color:var(--blue)}
.fld svg{width:16px;height:16px}
input[type=password],input[type=text]{flex:1;min-width:0;height:46px;border:0;background:transparent;color:var(--ink);font:500 16px "Inter",sans-serif;padding:0 12px;outline:0}
input::placeholder{color:var(--faint);font-weight:400}
.eye{flex:none;display:grid;place-items:center;width:44px;border:0;border-left:1px solid var(--border);background:none;color:var(--mute);cursor:pointer;border-radius:0 3px 3px 0}
.eye:hover{background:var(--bg);color:var(--ink)}
.eye:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
.eye .off{display:none}
.eye[aria-pressed="true"] .on{display:none}
.eye[aria-pressed="true"] .off{display:block}
.rem{display:flex;align-items:center;gap:9px;margin:14px 0 0;font-size:13.5px;color:var(--ink2);cursor:pointer;user-select:none}
.rem input{appearance:none;-webkit-appearance:none;flex:none;width:18px;height:18px;margin:0;border:1px solid var(--border2);border-radius:2px;background:#fff;display:grid;place-items:center;cursor:pointer;transition:background .15s,border-color .15s}
.rem input::after{content:"";width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px);opacity:0}
.rem input:checked{background:var(--blue);border-color:var(--blue)}
.rem input:checked::after{opacity:1}
.rem input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
button.go{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:46px;margin-top:16px;border:1px solid var(--blue);border-radius:4px;background:var(--blue);color:#fff;font:600 15px "Inter",sans-serif;cursor:pointer;transition:background .15s,border-color .15s}
button.go:hover{background:var(--blue-h);border-color:var(--blue-h)}
button.go:active{background:var(--blue-a);border-color:var(--blue-a)}
button.go:focus-visible{outline:2px solid #009cdb;outline-offset:2px}
button.go:disabled{cursor:wait;background:var(--blue-h)}
.sp{display:none;width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;animation:spin .7s linear infinite}
button.go.ld .sp{display:block}
@keyframes spin{to{transform:rotate(360deg)}}
.msg{display:none;margin-top:12px;padding:9px 12px;border:1px solid #fecdca;border-left:3px solid var(--err);border-radius:4px;background:var(--err-bg);font-size:13.5px;font-weight:500;color:var(--err)}
.msg.on{display:block}
.ft{display:flex;align-items:center;justify-content:center;gap:6px;padding:12px 22px;border-top:1px solid var(--border);background:var(--bg);font-size:12.5px;color:var(--mute)}
.ft svg{width:14px;height:14px;color:var(--green-ink)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.sp{animation-duration:2s}}
</style>
</head>

const KEY="agroeste.milho.turim.acesso";
const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const $=id=>document.getElementById(id);
const st={get:()=>{try{return localStorage.getItem(KEY)}catch(_){return null}},
          set:v=>{try{localStorage.setItem(KEY,v)}catch(_){}},
          del:()=>{try{localStorage.removeItem(KEY)}catch(_){}},
          sess:()=>{try{sessionStorage.setItem(KEY+".sessao","1")}catch(_){}}};
async function abrir(senha){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(senha),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u(SALT),iterations:ITER,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:u(IV)},key,u(DATA)));
}
function exibir(html){st.sess();document.open();document.write(html);document.close();}
function carregando(on,txt){const b=$("b");b.disabled=on;b.classList.toggle("ld",on);b.querySelector(".tx").textContent=txt;}
function erro(txt){$("m").textContent=txt;$("m").classList.add("on");$("fld").dataset.err="true";$("s").focus();$("s").select();}
$("eye").onclick=()=>{const s=$("s"),e=$("eye"),v=s.type==="password";s.type=v?"text":"password";
  e.setAttribute("aria-pressed",v);e.setAttribute("aria-label",v?"Ocultar senha":"Mostrar senha");e.title=e.getAttribute("aria-label");s.focus();};
$("s").addEventListener("input",()=>{$("fld").dataset.err="false";$("m").classList.remove("on")});
$("f").onsubmit=async e=>{
  e.preventDefault();
  const senha=$("s").value;
  if(!senha){erro("Digite a senha.");return}
  carregando(true,"Validando…");$("m").classList.remove("on");
  try{const html=await abrir(senha); if($("rem").checked) st.set(senha); else st.del(); exibir(html);}
  catch(_){carregando(false,"Acessar");erro("Senha inválida.");}
};
// acesso lembrado: entra direto; se a senha salva não abrir mais, volta ao formulário
(async()=>{
  const salva=st.get(); if(!salva) return;
  $("rem").checked=true; carregando(true,"Abrindo…");
  try{exibir(await abrir(salva))}
  catch(_){st.del();carregando(false,"Acessar");erro("O acesso salvo expirou. Digite a senha novamente.");}
})();
})();
</script>
